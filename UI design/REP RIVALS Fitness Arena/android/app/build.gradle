apply plugin: 'com.android.application'

// Only an origin is configurable. Endpoints and headers stay in native code.
def publicOrigin = System.getenv('REP_RIVALS_ANDROID_API_ORIGIN') ?: ''
if (publicOrigin) {
    def uri = new URI(publicOrigin)
    if (uri.scheme != 'https' || !uri.host || !uri.host.contains('.') ||
        !(uri.host ==~ /[a-zA-Z0-9.-]+/) || uri.host ==~ /[0-9.]+/ ||
        uri.userInfo || uri.path || uri.query != null || uri.fragment != null ||
        uri.port == 0 || uri.port > 65535 || uri.host.endsWith('.localhost')) {
        throw new GradleException('REP_RIVALS_ANDROID_API_ORIGIN must be a bare HTTPS DNS origin')
    }
}
def emulatorTls = System.getenv('REP_RIVALS_EMULATOR_TLS') == '1'
def devResources = rootProject.file('../../../.tools/android-auth-tls/res')

android {
    namespace = "com.reprivals.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.reprivals.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            resValue 'string', 'account_api_origin', emulatorTls ? 'https://127.0.0.1:4443' : publicOrigin
        }
        release {
            resValue 'string', 'account_api_origin', publicOrigin
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (emulatorTls) {
        if (!new File(devResources, 'raw/rep_rivals_dev_ca.pem').isFile()) {
            throw new GradleException('Run the development TLS setup before building the emulator APK')
        }
        sourceSets.debug.manifest.srcFile 'src/emulatorTls/AndroidManifest.xml'
        sourceSets.debug.res.srcDirs += ['src/emulatorTls/res', devResources]
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst { if (!publicOrigin) throw new GradleException('Set REP_RIVALS_ANDROID_API_ORIGIN for release') }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

