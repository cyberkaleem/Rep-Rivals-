services:
  - type: web
    name: rep-rivals-api
    runtime: node
    rootDir: backend
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
